<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<title>Bukely — sections</title>
<style>html, body { margin: 0; background: transparent; } canvas { display: block; image-rendering: pixelated; }</style>
</head>
<body>
<script type="module">
  import { W, MOBILE, loadFonts, layer, text, wrap, dotted, win, sprite, bits, paint } from "./bit.js";

  const data = await (await fetch("data.json", { cache: "no-store" })).json();
  await loadFonts();
  const probe = layer(10, 10).g;
  const X0 = MOBILE ? 8 : 16, WIN_W = W - 2 * X0 + 1;
  const STAR = ["...#...", "...#...", "#######", ".#####.", "..###..", ".##.##.", "##...##"];
  const FOLDER = ["#####...........", "#....#..........", "################", "#..............#", "#..............#", "#..............#", "#..............#", "#..............#", "#..............#", "#..............#", "#..............#", "################"];

  /** Draw into a layer of height h, then add it to the page as canvas #id. */
  const emit = (id, h, draw) => {
    const L = layer(W, h);
    draw(L.g);
    const c = document.createElement("canvas");
    c.id = id;
    document.body.appendChild(c);
    paint(c, bits(L), W, h);
  };

  // Focus: one window. Desktop puts the title beside the text; phones stack them.
  const focus = [
    ["Document AI", "PageIndex: vectorless, reasoning-based RAG, and the pipeline that parses and OCRs long documents."],
    ["Agents & MCP", "peerbox, where AI agents message each other over MCP; MCP servers and Claude Code tools."],
    ["Products", "WordLinea, a browser extension for learning languages from the shows you watch."],
  ];
  const TEXT_X = MOBILE ? 16 : 330;
  const rows = focus.map(([title, body]) => ({ title, lines: wrap(probe, body, 22, WIN_W - TEXT_X - 18) }));
  const rowH = (r) => (MOBILE ? 24 : 0) + r.lines.length * 24 + 22;
  emit("focus", 8 + 19 + rows.reduce((s, r) => s + rowH(r), 0) + 12, (g) => {
    const c = win(g, X0, 6, WIN_W, 19 + rows.reduce((s, r) => s + rowH(r), 0) + 4, "Focus", { active: false });
    let y = c.y + 6;
    rows.forEach((r, i) => {
      text(g, r.title, c.x + 15, y + 22, 22, { bold: true });
      const ty = y + (MOBILE ? 24 : 0);
      r.lines.forEach((ln, k) => text(g, ln, c.x + TEXT_X, ty + 22 + k * 24, 22));
      y += rowH(r);
      if (i < rows.length - 1) dotted(g, c.x + 8, y - 9, c.w - 16);
    });
  });

  emit("work", 34, (g) => {
    sprite(g, FOLDER, X0 + 2, 10);
    text(g, "Selected work", X0 + 26, 22, 22);
    text(g, `${data.repos.length} items`, W - X0, 22, 11, { align: "right" });
  });

  const k = (n) => (n >= 1000 ? `${(n / 1000).toFixed(1)}K` : String(n));
  data.repos.forEach((r, i) => {
    const meta = `${r.role.toLowerCase()} · ${r.language}`;
    const lines = wrap(probe, r.description, 22, MOBILE ? WIN_W - 34 : WIN_W - 230);
    // Desktop needs two lines of height for the stars and role on the right.
    const body = (MOBILE ? lines.length : Math.max(2, lines.length)) * 24 + (MOBILE ? 22 : 0);
    const h = 19 + 14 + body + 12;
    emit(`work-${i}`, 6 + h + 6, (g) => {
      const c = win(g, X0, 6, WIN_W, h, `${r.owner} / ${r.name}`, { active: false });
      lines.forEach((ln, j) => text(g, ln, c.x + 15, c.y + 30 + j * 24, 22));
      if (MOBILE) {
        const y = c.y + 30 + lines.length * 24 + 8;
        sprite(g, STAR, c.x + 15, y - 7);
        text(g, `${k(r.stars)}   ${meta}`, c.x + 27, y, 11);
      } else {
        const right = c.x + c.w - 15;
        const sw = text(g, k(r.stars), right, c.y + 30, 22, { align: "right" });
        sprite(g, STAR, right - sw - 12, c.y + 16);
        text(g, meta, right, c.y + 50, 11, { align: "right" });
      }
    });
  });

  window.__ready = true;
</script>
</body>
</html>
