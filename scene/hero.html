<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<title>Bukely — hero</title>
<link href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Jersey+10&family=Silkscreen&family=Pixelify+Sans&display=block" rel="stylesheet" />
<style>html, body { margin: 0; background: transparent; } canvas { display: block; image-rendering: pixelated; }</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="out"></canvas>
<script type="module">
  import * as THREE from "three";
  import { theme, FONT, W, loadFonts, layer, text, rect, dotted, line, bayer, bits, paint } from "./bit.js";

  const H = 252;
  const STAGE = { x: 0, y: 116, w: W, h: H - 116 };
  const TAU = Math.PI * 2;
  const data = await (await fetch("data.json", { cache: "no-store" })).json();
  await loadFonts();
  const fmt = (n) => n.toLocaleString("en-US");
  const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  const shortDate = (d) => `${MONTHS[+d.slice(5, 7) - 1]} ${+d.slice(8, 10)}`;

  // ---- Static layer: everything that does not move. ----
  const base = layer(W, H);
  const g = base.g;
  rect(g, 0, 0, W, 10);
  text(g, "BUKELY / AI ENGINEER", 3, 8, 8, FONT.label, { erase: true });
  text(g, `LAST 365 DAYS / ${data.updated}`, W - 3, 8, 8, FONT.label, { align: "right", erase: true });

  text(g, "Bukely", 0, 78, 72, FONT.name);
  text(g, "BUILDING", 230, 34, 8, FONT.label);
  ["production RAG systems,", "document intelligence,", "agentic developer tools."].forEach((s, i) => text(g, s, 230, 52 + i * 14, 12, FONT.body));

  dotted(g, 0, 88, W);
  const stats = [
    [fmt(data.total), "CONTRIBUTIONS"],
    [`${data.longestStreak}`, "DAY STREAK"],
    [data.busiest.label.toUpperCase().replace("’", "'"), "BUSIEST MONTH"],
  ];
  stats.forEach(([n, label], i) => {
    const x = 1 + i * 145; // Jersey's first glyph overhangs x=0
    const nw = text(g, n, x, 107, 20, FONT.num);
    text(g, label, x + nw + 5, 105, 8, FONT.label);
  });
  dotted(g, 0, 112, W);
  const staticBits = bits(base);

  // ---- The skyline: rendered small with flat light, then dithered to bits. ----
  const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(STAGE.w, STAGE.h);
  renderer.setClearColor(0, 0);
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // keep light values linear so dither density tracks them
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(13, STAGE.w / STAGE.h, 1, 800);
  // Three clearly separated tones: lit tops, half-lit fronts, dark sides.
  scene.add(new THREE.AmbientLight(0xffffff, 0.08));
  const key = new THREE.DirectionalLight(0xffffff, 1.0);
  key.position.set(0, 100, 0);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.72);
  fill.position.set(-15, 0, 100);
  scene.add(fill);

  const days = data.weeks.flatMap((w, wi) => w.map((d) => ({ ...d, wi })));
  const WEEKS = data.weeks.length;
  const max = Math.max(...days.map((d) => d.count), 1);
  const height = (c) => (c ? 0.4 + 9 * (Math.log1p(c) / Math.log1p(max)) ** 1.5 : 0.08);
  const X = (wi) => wi - (WEEKS - 1) / 2;
  const Z = (wd) => wd - 3;
  const bars = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.66, 1, 0.66).translate(0, 0.5, 0),
    new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true }),
    days.length,
  );
  const m = new THREE.Matrix4();
  days.forEach((d, i) => bars.setMatrixAt(i, m.makeScale(1, height(d.count), 1).setPosition(X(d.wi), 0.2, Z(d.weekday))));
  scene.add(bars);
  // Edges drawn pure red, which the ditherer always treats as ink.
  const edgeMat = new THREE.LineBasicMaterial({ color: 0xff0000, toneMapped: false });
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(WEEKS + 1.4, 0.2, 8.4), new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true }));
  plinth.position.y = 0.1;
  scene.add(plinth);
  scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(plinth.geometry), edgeMat).translateY(0.1));

  const best = days.find((d) => d.date === data.bestDay.date);
  const bestTop = new THREE.Vector3(X(best.wi), 0.2 + height(best.count), Z(best.weekday));
  const monthAnchors = data.months.map((mo) => ({ label: mo.label.toUpperCase(), p: new THREE.Vector3(X(mo.week) + 0.5, 0, 5.4) }));

  const scratch = layer(STAGE.w, STAGE.h);
  const over = layer(W, H);
  const project = (v) => {
    const p = v.clone().project(camera);
    return [STAGE.x + ((p.x + 1) / 2) * STAGE.w, STAGE.y + ((1 - p.y) / 2) * STAGE.h];
  };

  const out = document.getElementById("out");
  /** Draw loop phase t in [0, 1); the loop is seamless at t = 1. */
  window.__frame = (t) => {
    // A slow sway; seamless because it is a full sine period.
    const a = -0.42 + 0.1 * Math.sin(TAU * t);
    camera.position.set(Math.sin(a) * 96, 44, Math.cos(a) * 96);
    camera.lookAt(0, 2.2, 0);
    renderer.render(scene, camera);

    scratch.g.clearRect(0, 0, STAGE.w, STAGE.h);
    scratch.g.drawImage(renderer.domElement, 0, 0);
    const px = scratch.g.getImageData(0, 0, STAGE.w, STAGE.h).data;
    const frame = staticBits.slice();
    for (let y = 0; y < STAGE.h; y++)
      for (let x = 0; x < STAGE.w; x++) {
        const i = (y * STAGE.w + x) * 4;
        if (px[i + 3] < 128) continue;
        const r = px[i] / 255, gg = px[i + 1] / 255, b = px[i + 2] / 255;
        const edge = r > 0.8 && gg < 0.2 && b < 0.2;
        const lum = 0.299 * r + 0.587 * gg + 0.114 * b;
        // Light theme inks the shadows; dark theme inks the lit faces (lifted, or the fronts vanish).
        if (edge || (theme === "dark" ? lum ** 0.6 : 1 - lum) > bayer(x, y)) frame[(STAGE.y + y) * W + STAGE.x + x] = 1;
      }

    // Overlays that follow the model: month ticks and the best-day callout.
    over.g.clearRect(0, 0, W, H);
    monthAnchors.forEach(({ label, p }) => {
      const [x, y] = project(p);
      text(over.g, label, x, y + 9, 8, FONT.label, { align: "center" });
    });
    const [bx, by] = project(bestTop);
    const lx = Math.round(bx - 26), ly = STAGE.y + 8;
    line(over.g, bx, by - 3, bx, ly);
    line(over.g, bx, ly, lx, ly);
    over.g.font = `8px ${FONT.label}`;
    const label = `BEST DAY ${shortDate(best.date)} / ${fmt(best.count)}`;
    const lw = Math.ceil(over.g.measureText(label).width) + 6;
    for (let y = ly - 5; y < ly + 6; y++) for (let x = lx - lw; x < lx; x++) frame[y * W + x] = 0; // box is opaque
    rect(over.g, lx - lw, ly - 5, lw, 11);
    text(over.g, label, lx - 3, ly + 3, 8, FONT.label, { align: "right", erase: true });
    const ob = bits(over);
    for (let i = 0; i < ob.length; i++) if (ob[i]) frame[i] = 1;

    paint(out, frame, W, H);
  };
  window.__frame(0);
  window.__ready = true;
</script>
</body>
</html>
