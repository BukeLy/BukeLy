<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Bukely</title>
<meta name="description" content="Bukely — AI engineer building production RAG systems, document intelligence, and agentic developer tools." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
  .frame { aspect-ratio: 1600 / 680; }
  .intro { position: absolute; left: 0; bottom: 0; width: 46%; }
  h1 {
    font-size: 16.5cqw;
    line-height: 0.8;
    margin: 0 0 2.4cqw -0.6cqw;
  }
  h1 i { color: var(--accent); font-style: normal; }
  .lede {
    font-size: 1.75cqw;
    line-height: 1.38;
    letter-spacing: -0.012em;
    color: var(--ink-2);
    max-width: 32cqw;
    margin: 0;
  }
  .lede b { color: var(--ink); font-weight: 500; }
  .stage { right: -2cqw; top: 4.5cqw; bottom: 6cqw; width: 58%; }
  .fig { position: absolute; right: 0; bottom: 0; text-align: right; }
  @media (max-width: 800px) {
    .frame { aspect-ratio: auto; display: flex; flex-direction: column; }
    .intro { position: static; width: 100%; margin-top: 10cqw; }
    .lede { font-size: max(16px, 1.75cqw); max-width: none; }
    .stage { position: relative; right: auto; top: auto; bottom: auto; width: 100%; height: 95cqw; order: 3; }
    .fig { position: static; order: 4; text-align: left; }
  }
</style>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<main class="frame" id="frame">
  <header class="head">
    <span class="cap"><span class="dot"></span>Bukely</span>
    <span class="cap dim">AI Engineer — RAG, Document AI, Agents</span>
    <span class="cap dim meta">Profile / 2026</span>
  </header>
  <div class="stage" id="stage"></div>
  <section class="intro">
    <h1 class="serif">Bukely<i>.</i></h1>
    <p class="lede">Building <b>production RAG systems</b>, <b>document intelligence</b>, and agentic developer tools.</p>
  </section>
  <p class="fig">Fig. 01 — A document, indexed as a tree.<br />In orange: one reasoning path to an answer.<span class="cta"><br />Click to explore in 3D ↗</span></p>
</main>
<script type="module">
  import * as THREE from "three";
  import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
  import { start, palette, ACCENT, rng, wave, ease, TAU, capture } from "./common.js";

  const rand = rng(7);
  const paper = new THREE.MeshStandardMaterial({ color: palette.paper, roughness: 0.92, metalness: 0 });
  const hair = new THREE.LineBasicMaterial({ color: palette.line, transparent: true, opacity: 0.9 });
  const hairAccent = new THREE.LineBasicMaterial({ color: ACCENT });

  await start({
    stage: document.getElementById("stage"),
    fov: 24,
    target: new THREE.Vector3(0, 2.6, 0),
    cameraPath: (t, camera) => {
      camera.position.set(0, 3.9, 15.5);
      camera.lookAt(0, 2.5, 0);
    },
    build: async ({ scene }) => {
      const model = new THREE.Group();
      scene.add(model);
      const shadowed = (mesh) => ((mesh.castShadow = mesh.receiveShadow = true), mesh);

      // The document: a loose stack of sheets.
      const sheet = new THREE.BoxGeometry(2.6, 0.03, 3.4);
      const SHEETS = 22;
      for (let i = 0; i < SHEETS; i++) {
        const s = shadowed(new THREE.Mesh(sheet, paper));
        s.position.set((rand() - 0.5) * 0.08, 0.02 + i * 0.045, (rand() - 0.5) * 0.08);
        s.rotation.y = (rand() - 0.5) * 0.06;
        model.add(s);
      }
      const stackTop = 0.02 + SHEETS * 0.045;

      // The index: a tree rising out of the document, 1 → 3 → 6 → 12 nodes.
      const levels = [
        { n: 1, y: stackTop + 1.0, r: 0, size: 0.46 },
        { n: 3, y: stackTop + 2.1, r: 1.5, size: 0.36 },
        { n: 6, y: stackTop + 3.05, r: 2.55, size: 0.3 },
        { n: 12, y: stackTop + 3.85, r: 3.35, size: 0.24 },
      ];
      const nodes = levels.map((lv, li) =>
        Array.from({ length: lv.n }, (_, i) => {
          const a = ((i + 0.5) / lv.n) * TAU + li * 0.35;
          return { li, i, pos: new THREE.Vector3(Math.cos(a) * lv.r, lv.y, Math.sin(a) * lv.r), size: lv.size };
        }),
      );
      const parentOf = (li, i) => nodes[li - 1][Math.floor((i * nodes[li - 1].length) / nodes[li].length)];
      const path = [nodes[0][0], nodes[1][1], nodes[2][3], nodes[3][7]];
      const onPath = new Set(path);

      const segs = [new THREE.Vector3(0, stackTop, 0), nodes[0][0].pos];
      nodes.slice(1).forEach((row, k) => row.forEach((n) => segs.push(parentOf(k + 1, n.i).pos, n.pos)));
      model.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(segs), hair));

      const meshes = nodes.flat().map((n) => {
        const m = shadowed(new THREE.Mesh(new RoundedBoxGeometry(n.size, n.size, n.size, 3, n.size * 0.12), onPath.has(n) ? paper.clone() : paper));
        m.position.copy(n.pos);
        model.add(m);
        return { n, m };
      });
      const pathMeshes = path.map((n) => meshes.find((x) => x.n === n).m);

      // The reasoning path: drawn in orange behind a travelling reader.
      const route = new THREE.CurvePath();
      path.slice(1).forEach((n, i) => route.add(new THREE.LineCurve3(path[i].pos, n.pos)));
      const SAMPLES = 240;
      const trail = new THREE.Line(new THREE.BufferGeometry().setFromPoints(route.getSpacedPoints(SAMPLES)), hairAccent);
      trail.renderOrder = 1;
      hairAccent.transparent = true;
      model.add(trail);
      const lengths = route.getCurveLengths();
      const arrive = [0, ...lengths.map((l) => l / route.getLength())]; // progress at which each node is reached
      const reader = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 24, 16),
        new THREE.MeshBasicMaterial({ color: ACCENT, transparent: true, toneMapped: false }),
      );
      model.add(reader);
      const paperColor = new THREE.Color(palette.paper);
      const accentColor = new THREE.Color(ACCENT);

      return (t) => {
        model.rotation.y = -0.55 + 0.42 * (wave(t) - 0.5);
        // Timeline in u; offset so frame 0 shows the whole path lit (the still image).
        const u = (t + 0.78) % 1;
        const travel = ease((u - 0.06) / 0.62); // 0 → 1 while the reader walks root to leaf
        const fade = 1 - ease((u - 0.88) / 0.1); // everything returns to paper before the loop restarts
        route.getPointAt(Math.min(Math.max(travel, 0), 1), reader.position);
        reader.material.opacity = Math.min(ease(u / 0.05), 1 - ease((u - 0.68) / 0.08));
        trail.geometry.setDrawRange(0, Math.round(travel * SAMPLES) + 1);
        hairAccent.opacity = fade * (travel > 0 ? 1 : 0);
        pathMeshes.forEach((m, i) => {
          const lit = ease((travel - arrive[i]) / 0.06) * fade;
          m.material.color.lerpColors(paperColor, accentColor, lit);
          m.material.emissive.copy(accentColor).multiplyScalar(0.22 * lit);
        });
        // The leaf acknowledges the reader's arrival.
        pathMeshes[3].scale.setScalar(1 + 0.3 * ease((u - 0.66) / 0.08) * fade);
      };
    },
  });
</script>
</body>
</html>
